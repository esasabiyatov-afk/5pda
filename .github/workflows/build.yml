name: Build IPA

on:
  push:
    paths-ignore:
      - "**.md"
      - scripts/probe.py
      - scripts/probe.pub
      - .github/workflows/probe.yml
      - captcha/**
      - android/**
      - scripts/android_session.sh
      - .github/workflows/android.yml
      - .github/workflows/screens.yml
      - mcp/**
      - docs/screenshots/**
      - scripts/edit_header.py
      - .github/workflows/edit-header.yml
      - scripts/mcp_test.py
      - .github/workflows/mcp-test.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build IPA and publish SideStore source
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "APP_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          for scheme in FivePDA FivePDAX; do
            xcodebuild \
              -project FivePDA.xcodeproj \
              -scheme $scheme \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build > xcodebuild-$scheme.log 2>&1 || { grep -E 'error:' xcodebuild-$scheme.log | sort -u | head -100; exit 1; }
            grep -E 'BUILD SUCCEEDED' xcodebuild-$scheme.log
            test -f build/Build/Products/Release-iphoneos/$scheme.app/$scheme
            test -f build/Build/Products/Release-iphoneos/$scheme.app/Info.plist
          done

      - name: Show errors
        if: failure()
        run: grep -hE 'error:' xcodebuild-*.log | sort -u | head -100 || true

      - name: Package IPA
        run: |
          for pair in "FivePDA:5PDA.ipa" "FivePDAX:5PDA-X.ipa"; do
            scheme=${pair%%:*}; ipa=${pair##*:}
            rm -rf Payload && mkdir -p Payload
            cp -R build/Build/Products/Release-iphoneos/$scheme.app Payload/
            zip -qry "$ipa" Payload
            ls -la "$ipa"
            test $(stat -f%z "$ipa") -gt 100000
          done

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5PDA-${{ env.APP_VERSION }}
          path: |
            5PDA.ipa
            5PDA-X.ipa
          if-no-files-found: error

      - name: Generate SideStore source
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/make_source.py "$GITHUB_REPOSITORY" "v$APP_VERSION" 5PDA.ipa "$APP_VERSION" "$BUILD_NUMBER" 5PDA-X.ipa
          cp docs/icon.png icon.png
          cp Resources/Assets.xcassets/AppIconX.appiconset/icon-1024.png icon-x.png
          python3 -c "import json;print(json.load(open('source.json'))['apps'][0]['versions'][0]['localizedDescription'])" > release_notes.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: 5PDA ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.txt
          make_latest: true
          files: |
            5PDA.ipa
            5PDA-X.ipa
            source.json
            icon.png
            icon-x.png

      - name: Summary
        run: |
          {
            echo "### 5PDA $APP_VERSION"
            echo ""
            echo "SideStore source: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/source.json"
            echo ""
            echo "IPA: https://github.com/$GITHUB_REPOSITORY/releases/download/v$APP_VERSION/5PDA.ipa"
          } >> $GITHUB_STEP_SUMMARY
