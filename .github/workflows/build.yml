name: Build IPA

on:
  push:
    paths-ignore:
      - "**.md"
      - scripts/probe.py
      - scripts/probe.pub
      - .github/workflows/probe.yml
      - captcha/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build IPA and publish SideStore source
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "APP_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project FivePDA.xcodeproj \
            -scheme FivePDA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || { grep -E 'error:' xcodebuild.log | sort -u | head -100; exit 1; }
          grep -E 'BUILD SUCCEEDED' xcodebuild.log
          test -f build/Build/Products/Release-iphoneos/FivePDA.app/FivePDA
          test -f build/Build/Products/Release-iphoneos/FivePDA.app/Info.plist

      - name: Show errors
        if: failure()
        run: grep -E 'error:' xcodebuild.log | sort -u | head -100 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FivePDA.app Payload/
          zip -qry "5PDA.ipa" Payload
          ls -la 5PDA.ipa
          test $(stat -f%z 5PDA.ipa) -gt 100000

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5PDA-${{ env.APP_VERSION }}
          path: 5PDA.ipa
          if-no-files-found: error

      - name: Generate SideStore source
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/make_source.py "$GITHUB_REPOSITORY" "v$APP_VERSION" 5PDA.ipa "$APP_VERSION" "$BUILD_NUMBER"
          cp docs/icon.png icon.png
          python3 -c "import json;print(json.load(open('source.json'))['apps'][0]['versions'][0]['localizedDescription'])" > release_notes.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: 5PDA ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.txt
          make_latest: true
          files: |
            5PDA.ipa
            source.json
            icon.png

      - name: Summary
        run: |
          {
            echo "### 5PDA $APP_VERSION"
            echo ""
            echo "SideStore source: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/source.json"
            echo ""
            echo "IPA: https://github.com/$GITHUB_REPOSITORY/releases/download/v$APP_VERSION/5PDA.ipa"
          } >> $GITHUB_STEP_SUMMARY
