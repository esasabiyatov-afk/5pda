name: Edit 5PDA topic header

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view probe >/dev/null 2>&1 || gh release create probe --prerelease --latest=false --title "Probe results" --notes "-" --target "$GITHUB_SHA"
      - name: Edit
        env:
          GH_TOKEN: ${{ github.token }}
          PDA_LOGIN: ${{ secrets.PDA_LOGIN }}
          PDA_PASSWORD: ${{ secrets.PDA_PASSWORD }}
        run: python3 scripts/edit_header.py
