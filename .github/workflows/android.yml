name: Android session

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Длительность сеанса, минут"
        default: "50"

permissions:
  contents: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-session >/dev/null 2>&1 || gh release create android-session --prerelease --latest=false --title "Android session" --notes "Служебный сеанс эмулятора" --target "$GITHUB_SHA"
          echo "-1" > step.txt && gh release upload android-session step.txt --clobber
      - name: Emulator session
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          APK_KEY: ${{ secrets.APK_KEY }}
          PDA_LOGIN: ${{ secrets.PDA_LOGIN }}
          PDA_PASSWORD: ${{ secrets.PDA_PASSWORD }}
          SESSION_MINUTES: ${{ github.event.inputs.minutes }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android_session.sh
