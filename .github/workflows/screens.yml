name: Simulator screenshots

on:
  workflow_dispatch:
    inputs:
      routes:
        description: "Экраны через пробел"
        default: "tab:home tab:site article:463599 tab:forum forum:140 topic:1129821 topic:117396 profile:7288972 settings"
      login:
        description: "Войти тестовым аккаунтом (результат шифруется)"
        default: "false"

permissions:
  contents: write

jobs:
  screens:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Build for simulator
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project FivePDA.xcodeproj -scheme FivePDA -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E 'error:' build.log | sort -u | head -50; exit 1; }
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c=c or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/FivePDA.app
      - name: Login
        if: github.event.inputs.login == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PDA_LOGIN: ${{ secrets.PDA_LOGIN }}
          PDA_PASSWORD: ${{ secrets.PDA_PASSWORD }}
        run: |
          gh release view probe >/dev/null 2>&1 || gh release create probe --prerelease --latest=false --title "Probe results" --notes "-" --target "$GITHUB_SHA"
          python3 scripts/login_key.py "$RUNNER_TEMP/login.txt"
          echo "::add-mask::$(cat $RUNNER_TEMP/login.txt)"
      - name: Screenshots
        env:
          ROUTES: ${{ github.event.inputs.routes }}
        run: |
          mkdir -p shots
          LOGIN_ARG=$(cat "$RUNNER_TEMP/login.txt" 2>/dev/null || true)
          [ -n "$LOGIN_ARG" ] && echo "::add-mask::$LOGIN_ARG"
          i=0
          for r in $ROUTES; do
            i=$((i+1))
            xcrun simctl terminate "$UDID" com.fivepda.client >/dev/null 2>&1 || true
            if [ -n "${LOGIN_ARG:-}" ]; then
              xcrun simctl launch "$UDID" com.fivepda.client -screenshotRoute "$r" -screenshotLogin "$LOGIN_ARG" >/dev/null
            else
              xcrun simctl launch "$UDID" com.fivepda.client -screenshotRoute "$r" >/dev/null
            fi
            sleep 20
            name=$(printf "%02d-%s" $i "$(echo $r | tr ':' '-')")
            xcrun simctl io "$UDID" screenshot "shots/$name.png" >/dev/null 2>&1
            C=$(xcrun simctl get_app_container "$UDID" com.fivepda.client data 2>/dev/null)
            [ -f "$C/Documents/log.txt" ] && cp "$C/Documents/log.txt" "shots/$name.log"
            echo "$name"
          done
          cd shots && zip -q ../shots.zip *.png *.log 2>/dev/null || zip -q ../shots.zip *.png
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view screens >/dev/null 2>&1 || gh release create screens --prerelease --latest=false --title "Simulator screenshots" --notes "Служебные скриншоты" --target "$GITHUB_SHA"
          if [ -f "$RUNNER_TEMP/login.txt" ]; then
            # С входом в аккаунт на скриншотах личные данные — шифруем.
            openssl rand -out key.bin 32
            openssl enc -aes-256-cbc -pbkdf2 -salt -in shots.zip -out shots.zip.enc -pass file:key.bin
            openssl pkeyutl -encrypt -pubin -inkey scripts/probe.pub -pkeyopt rsa_padding_mode:oaep -in key.bin -out shots.key.enc
            gh release upload screens shots.zip.enc shots.key.enc --clobber
          else
            gh release upload screens shots.zip --clobber
          fi
