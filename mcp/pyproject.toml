[project]
name = "5pda-mcp"
version = "0.1.0"
description = "MCP-сервер для форума 4PDA: чтение тем, поиск, QMS и написание постов из Claude"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
5pda-mcp = "pda_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pda_mcp"]
